---
- name: Load var file based on the OS type
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_distribution }}_{{ ansible_distribution_release }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: Install OpenVPN packages
  ansible.builtin.package:
    name: "{{ openvpn_package_names }}"

- name: Copy OpenVPN config from files
  ansible.builtin.copy:
    dest: /etc/openvpn/server/
    mode: 0600
    owner: root
    src: primary.conf

- name: Load tasks for installing common name verification script
  ansible.builtin.include_tasks: install_verify_cn.yml

- name: Install certificate fetch script
  ansible.builtin.copy:
    dest: /etc/openvpn/server/
    mode: 0700
    owner: root
    src: fetch_user_ca_certs.sh

- name: Fetch DHS CA certificates using fetch_user_ca_certs.sh
  ansible.builtin.command: /etc/openvpn/server/fetch_user_ca_certs.sh
  args:
    chdir: /etc/openvpn/server
    creates: /etc/openvpn/server/certs

- name: >-
    Ensure that the directory where the OpenVPN unit drop-in will live
    actually exists
  ansible.builtin.file:
    group: root
    mode: 0755
    owner: root
    path: /etc/systemd/system/{{ openvpn_service_name }}@.service.d
    state: directory

- name: Configure OpenVPN service to run after multi-user and cloud-final
  community.general.ini_file:
    group: root
    mode: 0644
    # This is just to maintain the look and feel of the
    # /usr/lib/systemd/system/openvpn-server@.service file as provided
    # by the package manager.
    no_extra_spaces: true
    option: After
    owner: root
    path: >-
      /etc/systemd/system/{{ openvpn_service_name
      }}@.service.d/99-start-after-multi-user-and-cloud-final.conf
    section: Unit
    value: network.target multi-user.target cloud-final.service

- name: Disable OpenVPN private tmp directory to allow certificate file sharing
  community.general.ini_file:
    group: root
    mode: 0644
    # This is just to maintain the look and feel of the
    # /lib/systemd/system/openvpn-server@.service file as provided by
    # the package manager.
    no_extra_spaces: true
    option: PrivateTmp
    owner: root
    path: >-
      /etc/systemd/system/{{ openvpn_service_name }}@.service.d/99-no-private-tmp.conf
    section: Service
    value: false

- name: Enable OpenVPN
  ansible.builtin.systemd_service:
    # Unless you do this, systemd can sometimes get confused when you
    # try to start a service you just installed.
    daemon_reload: true
    enabled: true
    name: "{{ openvpn_service_name }}@primary"
    state: stopped

- name: Load tasks file for enabling NAT
  ansible.builtin.include_tasks: enable_nat.yml

- name: Configure ufw to allow OpenVPN via UDP
  community.general.ufw:
    comment: Allow OpenVPN via UDP
    proto: udp
    rule: allow
    to_port: openvpn
